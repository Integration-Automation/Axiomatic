# 本檔存在的唯一理由：**讓每支測試的逾時保護不必靠人記得打在命令列上。**
#
# 整套的跑法一直是 `-q --timeout=900`，理由寫在
# `test_suite_safety.test_this_interpreter_can_actually_enforce_a_test_timeout`：
# 這台機器同時在做正事（無人值守的批次可能已經連續跑了好幾天），而**掛住的測試比
# 失敗的測試更糟**——失敗會回報，掛住只是佔著機器不放，而且不會有人收到通知。
#
# 但那串旗標是**手打的**。漏打的時候保護就靜靜消失了，而且沒有任何訊號：套件照樣
# 全綠，只是從此沒有上限。本專案自己對這種形狀的判語是「預設關閉的保護不算保護」
# （見 `CLAUDE.md` 談角色閘為什麼不能當主機控制的守門）。既有的那支測試守的是
# 「這個直譯器**裝了** pytest-timeout 沒有」，不是「這一回合**真的有**逾時」——
# 兩件事之間差的就是這個檔案。
#
# ## 為什麼用 ini 選項，而不是 `addopts = --timeout=900`
#
#   * `addopts` 在**沒裝 pytest-timeout** 的直譯器上會變成
#     `error: unrecognized arguments: --timeout=900`，整套一支都不跑——那正是
#     2026-09-09 在正式直譯器 `.venv` 上實際踩過的坑（當時還接在 `| tail -6` 後面，
#     管線的結束碼是 `tail` 的，所以它回報成功）。未知的 **ini** 鍵只會是一句
#     `PytestConfigWarning`，套件照跑，上面那支測試也才有機會用它自己的訊息講清楚
#     要裝什麼。用 `addopts` 等於把一句清楚的診斷換成一個用法錯誤。
#   * `pytest_timeout.pytest_configure` 會把解析結果**快取**進 `config._env_timeout`，
#     之後每支測試的 `_get_item_settings` 讀的是那份快取，而不是當下的
#     `config.option`。所以「從自己的 `pytest_configure` 去設 `config.option.timeout`」
#     能不能生效，取決於兩個 `pytest_configure` 的呼叫順序——ini 是在任何
#     `pytest_configure` 之前就讀好的，沒有這個順序問題。
#
# 命令列的 `--timeout=N` 仍然優先（`get_env_settings` 先看 `getvalue("timeout")`，
# 再看環境變數 `PYTEST_TIMEOUT`，最後才看這裡），所以 `mutation_harness` 傳給 child
# 的那個較短的逾時照舊有效，個別測試的 `@pytest.mark.timeout(...)` 也照舊優先。
[pytest]
# ## 測試住在 repo 根目錄的 `test/`，不在套件裡（2026-09-22 搬家）
#
# `testpaths`：不帶路徑的 `py -3 -m pytest` 只收 `test/`。沒有它的話 pytest 會從 rootdir
# 往下遞迴找 `test_*.py`——今天剛好只有 `test/` 有，但任何一個目錄冒出一支同名檔就會被
# 一起收進來，而且不會有任何訊號。
#
# `pythonpath`：正式模組一律用頂層名字匯入（`import discord_bot`），少數地方用套件路徑
# （`from axiomatic._process_control import …`）。測試還住在套件裡的時候，這兩條都是
# 順手得到的：pytest 以 prepend 模式匯入 `axiomatic/test_x.py` 時，因為套件有
# `__init__.py`，它插進 `sys.path` 的是**套件的上一層**（repo 根目錄），而 conftest 再把
# 自己的目錄（＝套件目錄）插到最前面。搬到 `test/`（沒有 `__init__.py`）之後 pytest 只會
# 插 `test/` 本身，兩條都斷。這裡把兩個目錄明寫出來，順序照舊：套件在前、repo 根目錄在後
# （pytest 是 `reversed` 之後逐一 `insert(0, …)`，所以寫在前面的落在最前面）。
# `test/conftest.py` 自己也會補同樣兩個目錄：這一行管「有讀到這個 ini」的回合，conftest
# 那一份管 ini 沒生效的回合（用 `-c` 指別的設定檔、rootdir 跑掉）。
testpaths = test
pythonpath = axiomatic .
# 每支測試的上限。900 秒是沿用既有慣例的數字，不是重新挑的：整套約 450 秒跑完
# 六千七百多支（2026-09-20 兩個直譯器實測，剖析快取之後；在那之前是 840～1,020 秒），
# 所以單支破 900 秒一定是掛住了，不是慢。
timeout = 900
# Windows 沒有 `SIGALRM`，signal 那種方法在這台機器上裝不起來（`DEFAULT_METHOD`
# 會自己退到 thread）。這裡明寫是為了讓行為不隨平台改變——同樣的理由見
# `mutation_harness.py` 給 child 傳 `--timeout-method=thread` 那一段。
timeout_method = thread

# 用不到的第三方 pytest 外掛一律擋掉（2026-09-20）。這裡**可以**用 `addopts`：上面講的
# 風險是「未知的選項」會變成用法錯誤，而 `-p no:<名字>` 對沒裝的外掛只是一個沒人用的
# 封鎖名單項目——實測 `.venv`（沒有 locust／langsmith）照常收集、結束碼 0。
#   * `je_auto_control`：**這一項是為了正確性，不只是速度。** 那個函式庫用 pytest11 註冊
#     了一個外掛，而外掛是它的子模組，所以 pytest 一啟動就匯入整個套件——比 conftest
#     還早。套件匯入時就以相對路徑開 `AutoControlGUI.log`（附加模式），於是每一個在 repo
#     根目錄啟動的測試行程都往**正式**的那份記錄檔寫一行 `Load Windows Setting`（逐小時
#     計數與跑測試的時段一一對得上）。conftest 的停放 finder 攔得到之後的延遲匯入，攔不到
#     比它早的這一次。測試沒有用到它的 fixture 或 marker。原始碼樹 2026-09-22 起改讀環境變數
#     `JE_AUTOCONTROL_LOG_FILE`（沒設就寫使用者家目錄），conftest 在匯入前設好它——但比 conftest
#     早的外掛匯入時變數還沒設，所以這一項照樣是正確性。
#   * `locust`、`langsmith_plugin`、`faker`：`py -3` 全域環境裡跟本專案無關的套件帶進來的
#     （faker 兩個直譯器都有）。測試沒用到；擋掉之後每次啟動 pytest 從 2.9 秒降到 0.9 秒，
#     變異骨架每個變異都要啟動一次。
#   * `anyio`、`rerunfailures`（2026-09-20 補）：同樣沒用到，是全域環境帶進來的。`anyio` 是
#     其中最貴的一個（單獨擋掉 0.68 → 0.51 秒，兩個一起 0.48 秒）；`rerunfailures` 擋掉之後
#     `--reruns` 會變成用法錯誤，而那正是想要的——自動重跑會把偶發失敗藏起來。
# **查過、刻意不擋的**：`timeout`、`asyncio`、`xdist`、`pytest_cov`、`random_order`，每一筆的
# 理由寫在 `test_suite_safety._DECLARED_PYTEST_PLUGINS`。這份封鎖名單原本是「有人注意到
# 四個」，不是一道閘——全域再裝一個帶 pytest11 進入點的套件，它就會默默生效而沒有任何症狀。
# 守門：`test_suite_safety.test_the_gui_library_log_is_parked_outside_the_repo`（看結果：
# handler 最後指在哪）、`test_the_unused_third_party_pytest_plugins_are_blocked`（擋的那些
# 這一回合真的被擋，而且下面這一行多擋的每一個，都要在那份清單裡留下理由）與
# `test_every_loaded_pytest_plugin_is_declared_or_blocked`（載進來的每一個都得先被宣告過）。
addopts = -p no:je_auto_control -p no:locust -p no:langsmith_plugin -p no:faker -p no:anyio -p no:rerunfailures

# ## 平行跑整套：`-n 6 --dist loadfile`（2026-09-20 實測）
#
#     py -3 -m pip install pytest-xdist          # 兩個直譯器各裝一次，只多 execnet
#     py -3 -m pytest -q -n 6 --dist loadfile test
#
# 量到的數字（同一台機器、批次照常在跑）：序列 **約 450 秒** → `-n 6 --dist loadfile`
# **118 秒**。`-n auto`（12 個邏輯核心／6 個實體核心）也是 118 秒，`--dist load`（逐支分派）
# 121 秒——6 個 worker 就吃滿了，再多沒有用，分派的粒度也不是瓶頸。三種跑法的結果完全一樣
# （6752 passed、6 skipped），第一次就全綠，沒有為了平行改過任何一支測試。
#
# **它有沒有動到這台機器上的正式檔案，是量出來的、不是推論的**：跑之前對整個 repo（1,167 個
# 檔）取 mtime＋大小快照，跑完再比一次——變動的全部是**正在跑的批次自己**的產物
# （`.chrome_profile_snap/`、`chromedriver.log`、`events.ndjson`、`webrunner.log`、
# `webrunner_progress.json`）加上 `.pytest_cache/`，沒有一個是測試寫的。
#
# **為什麼 `-n` 不寫進上面的 `addopts`**：fresh clone 沒有 pytest-xdist，`-n` 會變成
# `error: unrecognized arguments`，整套一支都不跑——就是本檔開頭講的那個坑。pytest-xdist 與
# ruff／pylint 同一類：本機開發工具，不進 `requirements.txt`（`CLAUDE.md` 對 linter 的裁定
# 同理），所以是「文件裡的命令列」，漏打只是變慢，不會變得不安全。
#
# ## 順序相依的檢查（`py -3` 才有；`.venv` 沒裝 pytest-random-order）
#
#     py -3 -m pytest -q -n 6 --dist loadfile --random-order-bucket=global test
#
# 2026-09-20 實測**全綠**（6752 passed／6 skipped，120 秒），所以目前整套沒有藏著的執行順序
# 相依。洗牌是真的有發生——同一個檔案用兩個 `--random-order-seed` 收集出兩種不同順序，與不加
# 旗標的順序都不同（「空的選擇看起來跟乾淨的結果一樣」，所以這個正面對照不能省）。預設
# **不洗牌**：`random_order` 外掛要有 `--random-order*` 旗標才啟用，平常跑照舊是收集順序。

# ## 警告一律變成紅燈——但**兩條缺一不可**（2026-09-20）
#
# 這一套最容易無聲通過的缺陷是「沒有被 await 的 coroutine」：一個宣告成 `async` 的替身
# 被同步呼叫，正式碼拿到的是一個 coroutine 物件而不是值，而只要斷言沒有去看那個回傳值，
# 測試照樣全綠。本專案已經為這個形狀寫過三段註解——
# `test_bot_helpers.test_every_state_mutator_is_synchronous` 的 docstring 寫著「唯一的線索
# 是一句 'coroutine was never awaited' 的 RuntimeWarning，而它會淹沒在其他輸出裡」，另外
# 兩處是測試自己把 coroutine `close()` 掉以免留下雜訊（其中一處還寫著「雜訊唯一的作用是
# 訓練人忽略警告」）。**三處都是慣例，不是閘門**：真的漏一個，整套照樣綠。
#
# 直覺的寫法是只寫 `error::RuntimeWarning`，而它**不夠，還會看起來夠**。那句警告是在
# coroutine 被回收時從「無法向外丟的例外」那條路發出來的：filter 確實把它升級成例外，但
# 那個例外沒有人接得住，於是 pytest 的 unraisable 外掛把它**再包回一個警告**
# （`PytestUnraisableExceptionWarning`）。三種組合實測：兩條都有 → `1 failed`；只有第一條
# → `1 passed, 1 warning`；兩條都沒有 → `1 passed, 1 warning`。少寫第二條的人拿到的輸出
# 跟完全沒設一模一樣——本專案對這種形狀的判語是「空的選擇看起來跟乾淨的結果一樣」。
#
# 今天補上是**零成本**的：兩個直譯器各跑一次整套（各 6840 passed／1 skipped），警告分別
# 36 與 6 筆，**全部**是第三方套件的 `DeprecationWarning`（discord.py 的
# `asyncio.iscoroutinefunction`、defusedxml 的 `cElementTree`），RuntimeWarning 與 unraisable
# 都是 **0**。所以這兩條現在一筆都咬不到，純粹是把「下一個」抓出來。
#
# **為什麼不寫成 `error`（全部升級）**：那會連第三方的 DeprecationWarning 一起變紅，而那
# 正是 fresh clone 與另一個直譯器最容易不一樣的地方——紅會落在改了別的東西的人身上，就是
# `CLAUDE.md` 講行數棘輪時那個「紅落在錯的人、錯的時候」的形狀。
#
# 守門在 `test_suite_safety.py` 最後一節：正面對照查「**這一回合**真的有升級」（只查
# ini 檔裡寫了什麼不夠，命令列的 `-W` 蓋得掉），一支對帳 ini 與 `_WARNING_GATE`，還有一支
# 用子行程把上面那三種組合真的各跑一次。
#
# ## 第三條：`error::EncodingWarning`（2026-09-20 一起加）
#
# 它跟上面兩條無關，是把**另一條本來只存在於文件裡的檢查**接上閘門。`CLAUDE.md` 的
# 「Text I/O always names its encoding」那節列了一條手動掃描——`-X warn_default_encoding`
# 跑整套，看有沒有人在沒寫 `encoding=` 的情況下開檔。那條規則自己的判語是
# 「a convention is not an enforcement」，而它當時就是一條慣例：**沒帶那個旗標時
# `EncodingWarning` 根本不會發**，帶了也只是在 warnings summary 裡多幾行，套件照樣全綠。
#
# 加這一條的代價是 **0**，量過：`py -3 -X warn_default_encoding -m pytest -n 6 …` 跑完整套
# ——`6846 passed, 1 skipped`，`EncodingWarning` **0 筆**（連相依套件的程式碼在內；那 36 筆
# 警告還是同樣兩種第三方 `DeprecationWarning`）。不帶旗標時這一條更是純粹的空轉，因為
# 那個警告類別根本不會被發出來。
#
# 所以它的效果只有一個，而那正是要的：**下次有人跑那條文件裡的命令列時，新的違規是紅燈，
# 不是摘要裡的一行**。
filterwarnings =
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
    error::EncodingWarning
